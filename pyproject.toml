[build-system]
requires = [
    "setuptools >= 77.0",
    "setuptools_scm >= 8",
    "cython",
]
build-backend = "setuptools.build_meta"

[project]
name = "utm-precise"
dynamic = ["version"]
description = "Bidirectional UTM/GRS80 converter for Python"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Thomas Arnhold", email = "thomas@arnhold.org"},
]
keywords = ["utm", "grs80", "coordinate", "converter"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/tarnhold/utm-precise"
Repository = "https://github.com/tarnhold/utm-precise"

[tool.setuptools]
packages = ["utm"]

[tool.setuptools_scm]
write_to = "utm/_version.py"
